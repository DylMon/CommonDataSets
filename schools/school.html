<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">Loading…</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/school-template.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2245119166025427" crossorigin="anonymous"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL  = 'https://wakqidqrkqyplobtlzpn.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_Wl0t3iYbEMPci_Vn3dPg3A_QmWrIjBJ';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

    // Per-school brand colors and banner images extracted from existing CSS files.
    const SCHOOL_META = {
      'mit':          { color: '#a41931', banner: 'bannerMIT.png' },
      'harvard':      { color: '#a6152c', banner: 'bannerharvard.png' },
      'stanford':     { color: '#8c1515', banner: 'bannerstanford2.jpg' },
      'princeton':    { color: '#ed6d0b', banner: 'bannerprinceton.png' },
      'yale':         { color: '#00356b', banner: 'banneryale.png' },
      'columbia':     { color: '#6dabe4', banner: 'bannercolumbia.png' },
      'upenn':        { color: '#00144d', banner: 'bannerupenn.png' },
      'caltech':      { color: '#ff6e1e', banner: 'bannerCaltech.png' },
      'duke':         { color: '#004c97', banner: 'bannerduke.png' },
      'jhu':          { color: '#002d72', banner: 'bannerJHU.png' },
      'northwestern': { color: '#4e2686', banner: 'bannerNU.png' },
      'dartmouth':    { color: '#00693e', banner: 'bannerdartmouth.png' },
      'brown':        { color: '#ed1e25', banner: 'bannerbrown.png' },
      'vanderbilt':   { color: '#dcb163', banner: 'bannervandy.png' },
      'rice':         { color: '#002169', banner: 'bannerrice.png' },
      'washu':        { color: '#a60c10', banner: 'bannerwashu.png' },
      'notre-dame':   { color: '#0c2340', banner: 'bannerND.png' },
      'cornell':      { color: '#b31b1b', banner: 'bannercornell.png' },
      'uchicago':     { color: '#a6152c', banner: 'banneruchicago.jpg' },
      'cmu':          { color: '#c41230', banner: 'bannercmu.png' },
      'georgetown':   { color: '#041e42', banner: 'bannergeorgetown.png' },
      'emory':        { color: '#002878', banner: 'banneremory.png' },
      'wake-forest':  { color: '#1a1a1a', banner: 'bannerwakeforest.png' },
      'tufts':        { color: '#3172ae', banner: 'bannertufts.png' },
      'ucla':         { color: '#017dc3', banner: 'bannerucla.png' },
      'berkeley':     { color: '#193460', banner: 'bannerberkeley.png' },
      'ucsb':         { color: '#003660', banner: 'bannerucsb.png' },
      'uva':          { color: '#232d4b', banner: 'bannerUVA.png' },
      'umich':        { color: '#00274c', banner: 'bannerUMich.png' },
      'unc':          { color: '#4b9cd3', banner: 'bannerUNC.png' },
      'uf':           { color: '#fa4616', banner: 'banneruf.png' },
      'usc':          { color: '#990000', banner: 'bannerUSC.png' },
      'nyu':          { color: '#58078d', banner: 'bannerNYU.png' },
    };

    function fmt(val, type = 'number') {
      if (val == null) return '<span class="not-available">—</span>';
      if (type === 'pct')    return (val * 100).toFixed(1) + '%';
      if (type === 'money')  return '$' + Number(val).toLocaleString();
      if (type === 'demopct') return (val * 100).toFixed(1) + '%';
      return val;
    }

    function section(title, content) {
      return `<div class="info"><h4>${title}</h4></div>${content}`;
    }

    function tableHtml(headers, rows) {
      const th = headers.map(h => `<th>${h}</th>`).join('');
      const tbody = rows.map((r, i) =>
        `<tr${i % 2 === 1 ? ' class="active-row"' : ''}>${r.map(c => `<td>${c}</td>`).join('')}</tr>`
      ).join('');
      return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${th}</tr></thead><tbody>${tbody}</tbody></table></div>`;
    }

    function renderCards(s) {
      const pct = s.acceptance_rate != null ? (s.acceptance_rate * 100).toFixed(1) + '%' : '—';
      return `
        <div class="flex">
          <div class="card">
            <div class="card-image"></div>
            <div class="card-text"><h2>Acceptance Rate</h2><p>${pct}</p></div>
            <div class="card-stats">
              <div class="stat"><div class="value">${s.applicants_total != null ? s.applicants_total.toLocaleString() : '—'}</div><div class="type">Applicants</div></div>
              <div class="stat border"><div class="value">${s.admitted_total != null ? s.admitted_total.toLocaleString() : '—'}</div><div class="type">Accepted</div></div>
              <div class="stat"><div class="value">${s.enrolled_total != null ? s.enrolled_total.toLocaleString() : '—'}</div><div class="type">Enrolled</div></div>
            </div>
          </div>

          <div class="card">
            <div class="card-image"></div>
            <div class="card-text"><h2>Average GPA (W)</h2><p>${s.avg_gpa_weighted ?? '—'}</p></div>
            <div class="card-stats">
              <div class="stat"><div class="value">${s.sat_avg ?? '—'}</div><div class="type">SAT Avg</div></div>
              <div class="stat border"><div class="value">${s.act_avg != null ? s.act_avg : (s.act_25 && s.act_75 ? Math.round((s.act_25 + s.act_75) / 2) : '—')}</div><div class="type">ACT Avg</div></div>
              <div class="stat"><div class="value">${s.total_undergrads != null ? s.total_undergrads.toLocaleString() : '—'}</div><div class="type">Undergrads</div></div>
            </div>
          </div>

          <div class="card">
            <div class="card-image"></div>
            <div class="card-text"><h2>SAT Range</h2><p>${s.sat_avg ?? '—'}</p></div>
            <div class="card-stats">
              <div class="stat"><div class="value">${s.sat_math_25 ?? '—'}</div><div class="type">Math 25th</div></div>
              <div class="stat border"><div class="value">${s.sat_math_75 ?? '—'}</div><div class="type">Math 75th</div></div>
              <div class="stat"><div class="value">${s.sat_reading_25 ?? '—'} – ${s.sat_reading_75 ?? '—'}</div><div class="type">R&W Range</div></div>
            </div>
          </div>

          <div class="card">
            <div class="card-image"></div>
            <div class="card-text"><h2>ACT Range</h2><p>${s.act_25 ?? '—'} – ${s.act_75 ?? '—'}</p></div>
            <div class="card-stats">
              <div class="stat"><div class="value">${s.act_math_25 ?? '—'}</div><div class="type">Math 25th</div></div>
              <div class="stat border"><div class="value">${s.act_math_75 ?? '—'}</div><div class="type">Math 75th</div></div>
              <div class="stat"><div class="value">${s.act_english_25 ?? '—'} – ${s.act_english_75 ?? '—'}</div><div class="type">English</div></div>
            </div>
          </div>
        </div>`;
    }

    function renderFastFacts(s) {
      const na = '<span class="not-available">—</span>';
      const rows = [
        ['Location',                 s.location ?? na],
        ['School Type',              s.school_type ?? na],
        ['EA / ED',                  s.ea_ed_type ?? na],
        ['EA / ED Deadline',         s.ea_ed_deadline ?? na],
        ['Regular Decision Deadline',s.rd_deadline ?? na],
        ['SAT Writing',              s.sat_writing_required != null ? (s.sat_writing_required ? 'Required' : 'Not Required') : na],
        ['ACT Writing',              s.act_writing_required != null ? (s.act_writing_required ? 'Required' : 'Not Required') : na],
        ['SAT Superscore',           s.sat_superscore != null ? (s.sat_superscore ? 'Allowed' : 'Not Allowed') : na],
        ['ACT Superscore',           s.act_superscore != null ? (s.act_superscore ? 'Allowed' : 'Not Allowed') : na],
        ['US News Ranking',          s.us_news_ranking ?? na],
      ];
      const lines = rows.map(([label, val]) =>
        `<div class="line"><span class="label">${label}:</span> ${val}</div>`
      ).join('');
      return section('Fast Facts', `<div class="facts">${lines}</div>`);
    }

    function renderTuition(s) {
      const rows = [
        ['Tuition',        fmt(s.tuition_in_state, 'money'),  fmt(s.tuition_out_of_state, 'money')],
        ['Room & Board',   fmt(s.room_and_board, 'money'),    fmt(s.room_and_board, 'money')],
        ['Books & Supplies',fmt(s.books_supplies, 'money'),   fmt(s.books_supplies, 'money')],
        ['Other Expenses', fmt(s.other_expenses_in, 'money'), fmt(s.other_expenses_in, 'money')],
      ];
      const inTotal  = [s.tuition_in_state, s.room_and_board, s.books_supplies, s.other_expenses_in].reduce((a,v) => a + (v||0), 0);
      const outTotal = [s.tuition_out_of_state, s.room_and_board, s.books_supplies, s.other_expenses_in].reduce((a,v) => a + (v||0), 0);
      rows.push(['<strong>Total</strong>', `<strong>$${inTotal.toLocaleString()}</strong>`, `<strong>$${outTotal.toLocaleString()}</strong>`]);
      return section('Tuition / Fees', tableHtml(['', 'In-State', 'Out-of-State'], rows));
    }

    function renderDemographics(s) {
      const d = s.demographics;
      if (!d) return section('Student Body Demographics', '<p class="no-data">Data not yet available.</p>');
      const rows = [
        ['Nonresident Aliens', fmt(d.nonresident_aliens, 'demopct')],
        ['Hispanic / Latino',  fmt(d.hispanic, 'demopct')],
        ['Black / African American', fmt(d.black, 'demopct')],
        ['White',              fmt(d.white, 'demopct')],
        ['American Indian / Alaska Native', fmt(d.american_indian, 'demopct')],
        ['Asian',              fmt(d.asian, 'demopct')],
        ['Native Hawaiian / Pacific Islander', fmt(d.pacific_islander, 'demopct')],
        ['Two or More Races',  fmt(d.two_or_more, 'demopct')],
        ['Unknown',            fmt(d.unknown, 'demopct')],
      ];
      const genderRows = d.men_pct != null ? [
        ['Men',   fmt(d.men_pct, 'demopct')],
        ['Women', fmt(d.women_pct, 'demopct')],
      ] : null;
      return section('Student Body Demographics',
        tableHtml(['Ethnic Background', '% of Undergraduates'], rows) +
        (genderRows ? tableHtml(['Gender', '% of Undergraduates'], genderRows) : '')
      );
    }

    function renderJsonbSection(title, data, renderer) {
      if (!data) return section(title, '<p class="no-data">Data not yet available — will be backfilled from Common Data Set records.</p>');
      return section(title, renderer(data));
    }

    function renderApplicantPools(pools) {
      const rows = [
        ['Early Action / Decision', fmt(pools.ea?.applied), fmt(pools.ea?.accepted), fmt(pools.ea?.rate, 'pct')],
        ['Regular Decision',        fmt(pools.rd?.applied), fmt(pools.rd?.accepted), fmt(pools.rd?.rate, 'pct')],
        ['Waitlist',                fmt(pools.waitlist?.offered), fmt(pools.waitlist?.accepted_spots), '—'],
      ];
      return tableHtml(['Round', 'Applied', 'Accepted', 'Rate'], rows);
    }

    function renderTransfer(t) {
      const rows = [
        ['Male',  fmt(t.male?.applied), fmt(t.male?.admitted), fmt(t.male?.enrolled)],
        ['Female',fmt(t.female?.applied), fmt(t.female?.admitted), fmt(t.female?.enrolled)],
        ['Total', fmt(t.total?.applied), fmt(t.total?.admitted), fmt(t.total?.enrolled)],
      ];
      return tableHtml(['Transfer Applicants', 'Applied', 'Admitted', 'Enrolled'], rows);
    }

    function renderAdmissionFactors(factors) {
      const FACTOR_LABELS = {
        rigor:            'Rigor of Secondary School Record',
        class_rank:       'Class Rank',
        academic_gpa:     'Academic GPA',
        test_scores:      'Standardized Test Scores',
        essay:            'Application Essay',
        recommendations:  'Recommendations',
        interview:        'Interview',
        extracurriculars: 'Extracurricular Activities',
        talent:           'Talent / Ability',
        character:        'Character / Personal Qualities',
        first_gen:        'First Generation',
        alumni_relation:  'Alumni/ae Relation',
        geo_residence:    'Geographical Residence',
        state_residence:  'State Residence',
        religious:        'Religious Affiliation',
        racial_ethnic:    'Racial / Ethnic Status',
        volunteer:        'Volunteer Work',
        work_experience:  'Work Experience',
        applicant_interest:'Level of Applicant\'s Interest',
      };
      const RATINGS = ['very_important', 'important', 'considered', 'not_considered'];
      const LABELS  = ['Very Important', 'Important', 'Considered', 'Not Considered'];
      const rows = Object.entries(FACTOR_LABELS).map(([key, label]) => {
        const rating = factors[key];
        return [label, ...RATINGS.map(r => r === rating ? 'X' : '')];
      });
      return tableHtml(['Factor', ...LABELS], rows);
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const slug   = params.get('school');

      if (!slug) {
        document.body.innerHTML = '<p class="loading">No school specified. Add <code>?school=mit</code> to the URL.</p>';
        return;
      }

      document.body.innerHTML = '<p class="loading">Loading…</p>';

      const { data, error } = await supabase
        .from('schools')
        .select('*')
        .eq('slug', slug)
        .single();

      if (error || !data) {
        document.body.innerHTML = `<p class="loading">School not found: <strong>${slug}</strong></p>`;
        return;
      }

      const s    = data;
      const meta = SCHOOL_META[slug] ?? { color: '#333', banner: null };

      // Apply brand color and banner
      document.documentElement.style.setProperty('--brand', meta.color);
      document.title = s.name + ' — Common Data Sets';
      document.getElementById('page-title').textContent = s.name + ' — Common Data Sets';

      const bannerStyle = meta.banner
        ? `background-image: url('../images/banners/${meta.banner}'); background-size: cover; background-position: center;`
        : `background: linear-gradient(135deg, ${meta.color}, #000)`;

      document.body.innerHTML = `
        <div class="container">
          <div class="nav-wrapper" style="${bannerStyle}">
            <div class="left-side">
              <div class="nav-link-wrapper"><a href="../index.html">Data Sets</a></div>
              <div class="nav-link-wrapper"><a href="../compare.html">Compare</a></div>
            </div>
            <div class="brand">A2C Common Data Sets — ${s.name}</div>
          </div>

          ${renderCards(s)}

          <section class="row"><div class="container">
            ${renderFastFacts(s)}
            ${renderJsonbSection('Applicant Pools', s.applicant_pools, renderApplicantPools)}
            ${renderTuition(s)}
            ${renderDemographics(s)}
            ${renderJsonbSection('Admitted Student Academics', s.sat_act_breakdown, d =>
                tableHtml(['Breakdown', 'Count / %', '25th Percentile', '75th Percentile'], [
                  ['SAT Submitted',    fmt(d.sat_submitted_pct, 'pct'), '—', '—'],
                  ['ACT Submitted',    fmt(d.act_submitted_pct, 'pct'), '—', '—'],
                  ['SAT Reading & Writing', '—', fmt(s.sat_reading_25), fmt(s.sat_reading_75)],
                  ['SAT Math',         '—', fmt(s.sat_math_25), fmt(s.sat_math_75)],
                  ['ACT Math',         '—', fmt(s.act_math_25), fmt(s.act_math_75)],
                  ['ACT English',      '—', fmt(s.act_english_25), fmt(s.act_english_75)],
                ])
            )}
            ${renderJsonbSection('Admission Factors', s.admission_factors, renderAdmissionFactors)}
            ${renderJsonbSection('Transfer Admissions', s.transfer_stats, renderTransfer)}
          </div></section>
        </div>`;

      // Re-apply brand after innerHTML wipe
      document.documentElement.style.setProperty('--brand', meta.color);

      // Append back button as direct child of <body> so position:fixed is never
      // trapped inside a container (grid/transform ancestors break fixed positioning)
      const backBtn = document.createElement('a');
      backBtn.className = 'floating-back';
      backBtn.href = '../index.html';
      backBtn.textContent = '← Schools';
      document.body.appendChild(backBtn);
    }

    init();
  </script>
</head>
<body>
  <p class="loading">Loading…</p>
</body>
</html>
