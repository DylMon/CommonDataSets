<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LT7RKZPR5H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-LT7RKZPR5H');
    </script>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CommonDataSets — College Admissions Data for Top US Universities</title>
    <meta name="description" content="Acceptance rates, SAT scores, GPA, tuition, and admissions data for 33 top US universities — all in one place. Updated through 2023–24.">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css?v=2">
    <script src="js/header.js?v=2" defer></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2245119166025427"
     crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <div class="content-wrapper">
            <div class="sort-bar">
                <span class="sort-label">Sort by</span>
                <button class="sort-btn active" data-sort="us-news">US News</button>
                <button class="sort-btn" data-sort="acceptance-asc">Acceptance (Lowest)</button>
                <button class="sort-btn" data-sort="acceptance-desc">Acceptance (Highest)</button>
                <button class="sort-btn" data-sort="sat">SAT</button>
                <button class="sort-btn" data-sort="act">ACT</button>
            </div>
            <div id="school-list"><p class="loading">Loading…</p></div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const SUPABASE_URL  = 'https://wakqidqrkqyplobtlzpn.supabase.co';
        const SUPABASE_ANON = 'sb_publishable_Wl0t3iYbEMPci_Vn3dPg3A_QmWrIjBJ';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

        const LOGOS = {
            'mit':          'MITlogo.png',
            'harvard':      'harvardlogo.png',
            'stanford':     'stanfordlogo.png',
            'princeton':    'princetonlogo.png',
            'yale':         'yalelogo.png',
            'columbia':     'Columbialogo.png',
            'upenn':        'UPennlogo.png',
            'caltech':      'Caltechlogo.png',
            'duke':         'Dukelogo1.png',
            'jhu':          'JHUlogo.png',
            'northwestern': 'NUlogo1.png',
            'dartmouth':    'dartmouthlogo1.png',
            'brown':        'brownlogo.png',
            'vanderbilt':   'vandylogo.png',
            'rice':         'ricelogo.png',
            'washu':        'washulogo.png',
            'notre-dame':   'NDlogo.png',
            'cornell':      'cornelllogo.png',
            'uchicago':     'uchicagologo.png',
            'cmu':          'CMUlogo.png',
            'georgetown':   'georgetownlogo.png',
            'emory':        'emorylogo.png',
            'wake-forest':  'wakeforestlogo.png',
            'tufts':        'tuftslogo.png',
            'ucla':         'uclalogo.png',
            'berkeley':     'ucblogo.png',
            'ucsb':         'ucsblogo.png',
            'uva':          'UVAlogo.png',
            'umich':        'UMichlogo.png',
            'unc':          'UNClogo.png',
            'uf':           'uflogo.png',
            'usc':          'USClogo.png',
            'nyu':          'NYUlogo.png',
        };

        const SORTERS = {
            'us-news':        (a, b) => parseRank(a.us_news_ranking) - parseRank(b.us_news_ranking),
            'acceptance-asc': (a, b) => (a.acceptance_rate ?? 1) - (b.acceptance_rate ?? 1),
            'acceptance-desc':(a, b) => (b.acceptance_rate ?? 0) - (a.acceptance_rate ?? 0),
            'sat':            (a, b) => (b.sat_avg ?? 0) - (a.sat_avg ?? 0),
            'act':            (a, b) => actMid(b) - actMid(a),
        };

        function parseRank(str) {
            if (!str) return 999;
            const m = str.match(/(\d+)/);
            return m ? parseInt(m[1]) : 999;
        }

        function actMid(s) {
            if (s.act_25 != null && s.act_75 != null) return (s.act_25 + s.act_75) / 2;
            return 0;
        }

        function fmtPct(val) {
            return val != null ? (val * 100).toFixed(1) + '%' : '—';
        }

        let allSchools = [];

        function renderList(sortKey) {
            const sorted = [...allSchools].sort(SORTERS[sortKey]);
            document.getElementById('school-list').innerHTML = sorted.map((s, i) => {
                const actRange = s.act_25 != null && s.act_75 != null ? `${s.act_25}–${s.act_75}` : '—';
                return `
                <a class="school-row" href="schools/${s.slug}.html">
                    <div class="school-rank">${i + 1}</div>
                    <img class="school-logo" src="images/logos/${LOGOS[s.slug]}" alt="${s.name}" />
                    <div class="school-name">${s.name}</div>
                    <div class="school-stats">
                        <div class="stat-item">
                            <div class="stat-val">${fmtPct(s.acceptance_rate)}</div>
                            <div class="stat-label">Acceptance</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-val">${s.sat_avg ?? '—'}</div>
                            <div class="stat-label">SAT Avg</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-val">${actRange}</div>
                            <div class="stat-label">ACT Range</div>
                        </div>
                    </div>
                </a>`;
            }).join('');
        }

        function estimateSatAvg(school, cds) {
            if (cds?.sat_composite_25 != null && cds?.sat_composite_75 != null) {
                return Math.round((cds.sat_composite_25 + cds.sat_composite_75) / 2);
            }
            if (cds?.sat_reading_25 != null && cds?.sat_reading_75 != null &&
                cds?.sat_math_25 != null && cds?.sat_math_75 != null) {
                const total25 = cds.sat_reading_25 + cds.sat_math_25;
                const total75 = cds.sat_reading_75 + cds.sat_math_75;
                return Math.round((total25 + total75) / 2);
            }
            return school.sat_avg ?? null;
        }

        async function init() {
            const [{ data: schoolsData, error }, { data: cdsData }] = await Promise.all([
                supabase
                    .from('schools')
                    .select('slug, name, us_news_ranking, acceptance_rate, sat_avg, act_25, act_75')
                    .eq('data_year', '2023-24'),
                supabase
                    .from('cds_2024_2025')
                    .select('slug, sat_composite_25, sat_composite_75, sat_reading_25, sat_reading_75, sat_math_25, sat_math_75'),
            ]);

            if (error || !schoolsData) {
                document.getElementById('school-list').innerHTML = '<p class="loading">Failed to load schools.</p>';
                return;
            }

            const cdsBySlug = new Map((cdsData ?? []).map(c => [c.slug, c]));

            allSchools = schoolsData.map(s => ({
                ...s,
                sat_avg: estimateSatAvg(s, cdsBySlug.get(s.slug)),
            }));
            renderList('us-news');

            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderList(btn.dataset.sort);
                });
            });
        }

        init();
    </script>
</body>
</html>
